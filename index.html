<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Soju</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff5f8 0%, #f8bbd0 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
        color: #880e4f;
        position: relative;
      }

      .container {
        text-align: center;
        padding: 40px 20px;
        max-width: 1200px;
        z-index: 10;
        position: relative;
      }

      /* Image Gallery Section */
      .gallery {
        margin: 30px auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
        opacity: 0;
        animation: fadeIn 2s forwards 1.5s;
      }

      .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(233, 30, 99, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        background: white;
        aspect-ratio: 1 / 1;
      }

      .gallery-item:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 15px 40px rgba(233, 30, 99, 0.5);
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }

      .gallery-item:hover img {
        transform: scale(1.1);
      }

      .gallery-item::before {
        content: "❤️";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 60px;
        z-index: 2;
        transition: transform 0.3s ease;
        opacity: 0;
      }

      .gallery-item:hover::before {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }

      /* Heart Animation */
      .heart {
        font-size: clamp(80px, 20vw, 120px);
        color: #e91e63;
        cursor: pointer;
        transition: transform 0.3s ease;
        animation: pulse 1.5s infinite alternate;
        display: inline-block;
        filter: drop-shadow(0 0 10px rgba(233, 30, 99, 0.4));
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(1.1);
        }
      }

      h1 {
        margin-top: 20px;
        font-size: clamp(2rem, 8vw, 3.5rem);
        opacity: 0;
        animation: fadeIn 2s forwards 0.5s;
        background: linear-gradient(135deg, #e91e63, #880e4f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        -moz-background-clip: text;
        -moz-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
        letter-spacing: 2px;
      }

      p {
        font-size: clamp(1rem, 4vw, 1.3rem);
        opacity: 0;
        margin-bottom: 10px;
        animation: fadeIn 2s forwards 1s;
        line-height: 1.8;
      }

      #message {
        margin-top: 30px;
        padding: 20px 30px;
        font-size: clamp(1.2rem, 5vw, 1.6rem);
        font-weight: bold;
        color: #fff;
        background: linear-gradient(135deg, #e91e63, #ad1457);
        border-radius: 15px;
        display: none;
        opacity: 0;
        transition: opacity 0.8s ease;
        box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      /* Background floating elements */
      .floating-heart {
        position: absolute;
        bottom: -50px;
        color: rgba(233, 30, 99, 0.2);
        font-size: 24px;
        animation: float 8s infinite linear;
        z-index: 1;
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-110vh) rotate(360deg);
          opacity: 0;
        }
      }

      /* Mobile Adjustments */
      @media (max-width: 768px) {
        .container {
          padding: 20px 10px;
        }
        .heart {
          margin-bottom: 10px;
        }
        .gallery {
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 15px;
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Generate random floating hearts
      for (let i = 0; i < 15; i++) {
        let heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = Math.random() * 5 + 5 + "s";
        heart.style.animationDelay = Math.random() * 5 + "s";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";
        document.body.appendChild(heart);
      }

      function showMessage() {
        var msg = document.getElementById("message");
        msg.style.display = "block";
        setTimeout(() => {
          msg.style.opacity = "1";
        }, 50);
      }
    </script>

    <div class="container">
      <div class="heart" onclick="showMessage()">❤️</div>
      <h1>Happy Valentine's Day!</h1>
      <p>To my Soju, Poppy, Radha, and Shalniya...</p>
      <p>Tap the heart for a surprise.</p>

        </div>
        <div class="gallery-item">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'%3E%3Cdefs%3E%3ClinearGradient id='embrace' x1='0%25' y1='0%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' style='stop-color:%23fbc2eb'/%3E%3Cstop offset='100%25' style='stop-color:%23a6c1ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='500' height='500' fill='url(%23embrace)'/%3E%3Cellipse cx='200' cy='300' rx='60' ry='100' fill='%234a90e2'/%3E%3Cellipse cx='300' cy='300' rx='60' ry='100' fill='%23e91e63'/%3E%3Ccircle cx='200' cy='220' r='40' fill='%23fdb9a6'/%3E%3Ccircle cx='300' cy='220' r='40' fill='%23fdb9a6'/%3E%3Cpath d='M 140 280 Q 200 320 260 280' stroke='%234a90e2' stroke-width='40' fill='none' stroke-linecap='round'/%3E%3Cpath d='M 240 280 Q 300 320 360 280' stroke='%23e91e63' stroke-width='40' fill='none' stroke-linecap='round'/%3E%3Cpath d='M 230 150 Q 250 100 270 150' stroke='%23e91e63' stroke-width='8' fill='none'/%3E%3Cpath d='M 250 110 L 230 150 L 270 150 Z' fill='%23e91e63'/%3E%3Ctext x='250' y='480' font-family='Arial' font-size='26' fill='%23880e4f' text-anchor='middle'%3E%E2%9D%A4%EF%B8%8F Warm Embrace %E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E" alt="Romantic couple embrace" />
        </div>
        <div class="gallery-item">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'%3E%3Cdefs%3E%3ClinearGradient id='walk' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' style='stop-color:%23a8edea'/%3E%3Cstop offset='100%25' style='stop-color:%23fed6e3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='500' height='500' fill='url(%23walk)'/%3E%3Cellipse cx='450' cy='100' rx='50' ry='50' fill='%23ffe66d' opacity='0.8'/%3E%3Crect x='50' y='400' width='400' height='20' fill='%2388c9a1' rx='10'/%3E%3Cellipse cx='180' cy='280' rx='35' ry='60' fill='%234a90e2'/%3E%3Cellipse cx='320' cy='280' rx='35' ry='60' fill='%23e91e63'/%3E%3Ccircle cx='180' cy='220' r='30' fill='%23fdb9a6'/%3E%3Ccircle cx='320' cy='220' r='30' fill='%23fdb9a6'/%3E%3Cline x1='160' y1='340' x2='140' y2='390' stroke='%234a90e2' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='200' y1='340' x2='220' y2='390' stroke='%234a90e2' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='300' y1='340' x2='280' y2='390' stroke='%23e91e63' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='340' y1='340' x2='360' y2='390' stroke='%23e91e63' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M 200 250 Q 250 230 300 250' stroke='%23e91e63' stroke-width='3' fill='none'/%3E%3Ctext x='250' y='470' font-family='Arial' font-size='24' fill='%23880e4f' text-anchor='middle'%3E%E2%9D%A4%EF%B8%8F Walking Together %E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E" alt="Couple walking together" />
        </div>
      </div>

      <div id="message">You are my favorite person in every universe. 💖</div>
    </div>
  </body>
</html>
