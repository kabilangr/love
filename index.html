<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Soju</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff5f8 0%, #f8bbd0 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
        color: #880e4f;
        position: relative;
      }

      .container {
        text-align: center;
        padding: 40px 20px;
        max-width: 1200px;
        z-index: 10;
        position: relative;
      }

      /* Image Gallery Section */
      .gallery {
        margin: 30px auto;
        display: none;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      
      .gallery.show {
        display: grid;
      }
      
      .gallery.show {
        opacity: 1;
      }

      .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(233, 30, 99, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        background: white;
        aspect-ratio: 1 / 1;
      }

      .gallery-item:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 15px 40px rgba(233, 30, 99, 0.5);
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }

      .gallery-item:hover img {
        transform: scale(1.1);
      }

      .gallery-item::before {
        content: "❤️";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 60px;
        z-index: 2;
        transition: transform 0.3s ease;
        opacity: 0;
      }

      .gallery-item:hover::before {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }

      /* Heart Animation */
      .heart {
        font-size: clamp(80px, 20vw, 120px);
        color: #e91e63;
        cursor: pointer;
        transition: transform 0.3s ease;
        animation: pulse 1.5s infinite alternate;
        display: inline-block;
        filter: drop-shadow(0 0 10px rgba(233, 30, 99, 0.4));
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(1.1);
        }
      }

      h1 {
        margin-top: 20px;
        font-size: clamp(2rem, 8vw, 3.5rem);
        opacity: 0;
        animation: fadeIn 2s forwards 0.5s;
        background: linear-gradient(135deg, #e91e63, #880e4f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        -moz-background-clip: text;
        -moz-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
        letter-spacing: 2px;
      }

      p {
        font-size: clamp(1rem, 4vw, 1.3rem);
        opacity: 0;
        margin-bottom: 10px;
        animation: fadeIn 2s forwards 1s;
        line-height: 1.8;
      }

      #message {
        margin-top: 30px;
        padding: 20px 30px;
        font-size: clamp(1.2rem, 5vw, 1.6rem);
        font-weight: bold;
        color: #fff;
        background: linear-gradient(135deg, #e91e63, #ad1457);
        border-radius: 15px;
        display: none;
        opacity: 0;
        transition: opacity 0.8s ease;
        box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      /* Background floating elements */
      .floating-heart {
        position: absolute;
        bottom: -50px;
        color: rgba(233, 30, 99, 0.2);
        font-size: 24px;
        animation: float 8s infinite linear;
        z-index: 1;
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-110vh) rotate(360deg);
          opacity: 0;
        }
      }

      /* Mobile Adjustments */
      @media (max-width: 768px) {
        .container {
          padding: 20px 10px;
        }
        .heart {
          margin-bottom: 10px;
        }
        .gallery {
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          gap: 12px;
          padding: 12px;
          margin: 20px auto;
        }
        
        h1 {
          font-size: clamp(1.5rem, 8vw, 2.5rem);
        }
        
        p {
          font-size: clamp(0.9rem, 4vw, 1.1rem);
        }
      }
      
      @media (max-width: 480px) {
        .container {
          padding: 15px 8px;
        }
        
        .gallery {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
          padding: 10px;
        }
        
        .gallery-item {
          border-radius: 15px;
        }
        
        #message {
          padding: 15px 20px;
          font-size: clamp(1rem, 5vw, 1.3rem);
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Generate random floating hearts
      for (let i = 0; i < 15; i++) {
        let heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = Math.random() * 5 + 5 + "s";
        heart.style.animationDelay = Math.random() * 5 + "s";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";
        document.body.appendChild(heart);
      }

      function showMessage() {
        var gallery = document.getElementById("gallery");
        var msg = document.getElementById("message");
        
        // Show gallery first
        gallery.classList.add("show");
        
        // Then show message after a delay
        setTimeout(() => {
          msg.style.display = "block";
          setTimeout(() => {
            msg.style.opacity = "1";
          }, 50);
        }, 800);
      }
    </script>

    <div class="container">
      <div class="heart" onclick="showMessage()">❤️</div>
      <h1>Happy Valentine's Day!</h1>
      <p>To my Soju, Poppy, Radha, and Shalniya...</p>
      <p>Tap the heart for a surprise.</p>

      <!-- Love Couple Image Gallery -->
      <div class="gallery" id="gallery">
        <div class="gallery-item">
          <img src="images/couple-sunset.svg" alt="Romantic couple silhouette at beautiful sunset with hearts" loading="lazy" />
        </div>
        <div class="gallery-item">
          <img src="images/couple-hands.svg" alt="Couple holding hands with floating hearts and bokeh background" loading="lazy" />
        </div>
        <div class="gallery-item">
          <img src="images/couple-bench.svg" alt="Romantic couple sitting together on park bench" loading="lazy" />
        </div>
        <div class="gallery-item">
          <img src="images/couple-moonlight.svg" alt="Couple holding hands under moonlight with starry sky" loading="lazy" />
        </div>
      </div>

      <div id="message">You are my favorite person in every universe. 💖</div>
    </div>
  </body>
</html>
