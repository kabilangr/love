<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="parkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#B0E2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#98D8C8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Skin gradient -->
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDAB9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6B89C;stop-opacity:1" />
    </linearGradient>
    
    <!-- Clothing -->
    <linearGradient id="jacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B22222;stop-opacity:1" />
    </linearGradient>
    
    <!-- Tree gradient -->
    <radialGradient id="foliage">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="600" fill="url(#parkBg)"/>
  
  <!-- Sun/Light source -->
  <circle cx="650" cy="100" r="60" fill="#FFE4B5" opacity="0.7"/>
  <circle cx="650" cy="100" r="45" fill="#FFFACD" opacity="0.8"/>
  
  <!-- Trees in background -->
  <g opacity="0.6">
    <!-- Tree 1 -->
    <rect x="100" y="200" width="20" height="150" fill="#8B4513"/>
    <circle cx="110" cy="180" r="50" fill="url(#foliage)"/>
    <circle cx="90" cy="200" r="40" fill="url(#foliage)"/>
    <circle cx="130" cy="200" r="40" fill="url(#foliage)"/>
    
    <!-- Tree 2 -->
    <rect x="680" y="220" width="18" height="130" fill="#8B4513"/>
    <circle cx="689" cy="200" r="45" fill="url(#foliage)"/>
    <circle cx="670" cy="220" r="35" fill="url(#foliage)"/>
    <circle cx="708" cy="220" r="35" fill="url(#foliage)"/>
  </g>
  
  <!-- Path/Ground -->
  <ellipse cx="400" cy="550" rx="350" ry="80" fill="#C4A57B" opacity="0.8"/>
  <path d="M 50 500 Q 400 480 750 500 L 750 600 L 50 600 Z" fill="#7CBF7C" opacity="0.7"/>
  
  <!-- Bench -->
  <rect x="250" y="420" width="300" height="15" rx="7" fill="#8B4513"/>
  <rect x="260" y="380" width="10" height="50" rx="3" fill="#654321"/>
  <rect x="530" y="380" width="10" height="50" rx="3" fill="#654321"/>
  <rect x="250" y="380" width="300" height="10" rx="5" fill="#8B4513"/>
  
  <!-- Male figure (sitting left) -->
  <g>
    <!-- Head -->
    <ellipse cx="320" cy="330" rx="38" ry="42" fill="url(#skinTone)"/>
    <!-- Hair -->
    <path d="M 282 315 Q 282 290 320 286 Q 358 290 358 315 L 352 325 Q 330 295 320 295 Q 310 295 288 325 Z" 
          fill="#2C1810"/>
    <!-- Neck -->
    <rect x="308" y="368" width="24" height="18" rx="6" fill="url(#skinTone)"/>
    <!-- Jacket -->
    <path d="M 295 386 L 280 410 L 275 470 L 365 470 L 360 410 L 345 386 Z" fill="url(#jacket)"/>
    <!-- Arm around partner -->
    <path d="M 345 390 Q 380 380 420 390" stroke="url(#jacket)" stroke-width="24" fill="none" stroke-linecap="round"/>
    <!-- Legs (sitting) -->
    <rect x="285" y="465" width="35" height="70" rx="10" fill="#2F4F4F"/>
  </g>
  
  <!-- Female figure (sitting right, leaning) -->
  <g>
    <!-- Head (tilted, leaning on shoulder) -->
    <ellipse cx="410" cy="350" rx="36" ry="40" fill="url(#skinTone)" transform="rotate(-15 410 350)"/>
    <!-- Hair (long) -->
    <path d="M 374 335 Q 374 305 410 300 Q 446 305 446 335 Q 446 370 440 395 L 380 395 Q 374 370 374 335" 
          fill="#1A0F0A"/>
    <!-- Neck -->
    <rect x="396" y="385" width="24" height="18" rx="6" fill="url(#skinTone)" transform="rotate(-10 408 394)"/>
    <!-- Coat -->
    <path d="M 380 403 L 365 428 L 358 475 L 462 475 L 455 428 L 440 403 Z" fill="url(#coat)"/>
    <!-- Legs (sitting) -->
    <rect x="368" y="470" width="35" height="65" rx="10" fill="#000080"/>
  </g>
  
  <!-- Heart effects -->
  <g opacity="0.8">
    <text x="380" y="280" font-size="28" fill="#FF1493">❤</text>
    <text x="300" y="310" font-size="22" fill="#FF69B4">❤</text>
    <text x="440" y="300" font-size="24" fill="#FFB6C1">❤</text>
  </g>
  
  <!-- Birds in sky -->
  <g stroke="#696969" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 500 150 Q 505 145 510 150"/>
    <path d="M 510 150 Q 515 145 520 150"/>
    <path d="M 560 180 Q 565 175 570 180"/>
    <path d="M 570 180 Q 575 175 580 180"/>
  </g>
  
  <!-- Light sparkles -->
  <circle cx="250" cy="320" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="480" cy="310" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="350" cy="250" r="2" fill="#FFFFFF" opacity="0.9"/>
</svg>
